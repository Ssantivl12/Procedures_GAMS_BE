openapi: "3.0.3"
info:
  title: Auth
  version: "1.0"
tags:
  - name: auth

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Autenticar usuario
      description: Rate-limited (5 intentos / 15 min). Devuelve access + refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: "#/components/schemas/UserPayload"
        "401":
          description: Credenciales inválidas
        "429":
          description: Demasiados intentos

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Nuevos tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        "401":
          description: Token inválido o expirado

  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesión
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Sesión cerrada

  /auth/change-password:
    post:
      tags: [auth]
      summary: Cambiar contraseña
      description: Rate-limited. Disponible para todos los roles autenticados.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Contraseña actualizada
        "401":
          description: Contraseña actual incorrecta

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserPayload:
      type: object
      properties:
        sub:
          type: string
          format: uuid
        email:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [SUPERADMIN, ENCARGADO, SECRETARIA, INSPECTOR]
        firstName:
          type: string
        lastName:
          type: string
        isActive:
          type: boolean
